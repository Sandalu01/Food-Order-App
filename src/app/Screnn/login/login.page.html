<ion-header >
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/register"></ion-back-button>
    </ion-buttons>
    <ion-title >Login </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="container">
    <form >
        <ion-item>
          <ion-label position="floating">Email</ion-label>
          <ion-input type="email" fill="fill"[(ngModel)]="email" name="something"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="floating">Password</ion-label>
          <ion-input  type="password" fill="fill"[(ngModel)]="password" name="something"></ion-input>
        </ion-item>
      <ion-button expand="full" class="botton-color" (click)="login()">Login</ion-button>
      <ion-button expand="full" color="medium" routerLink="/register" >Sign Up</ion-button>
    </form>
  </div>
</ion-content>
